{{- $previewAccess := .Values.previewAccess | default (dict "enabled" true) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  pg_hba.conf: |
    local all all trust
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::/0 reject
    hostssl all all 0.0.0.0/0 scram-sha-256
    hostssl all all ::/0 scram-sha-256
  watch-tls.sh: |
    #!/bin/sh
    set -eu
    checksum() { sha256sum /etc/pinelink/tls/tls.crt /etc/pinelink/tls/tls.key | sha256sum; }
    initial=$(checksum)
    "$@" &
    child=$!
    (
      previous=$initial
      while kill -0 "$child" 2>/dev/null; do
        sleep 10
        current=$(checksum)
        if [ "$current" != "$previous" ]; then kill -HUP "$child" 2>/dev/null || true; previous=$current; fi
      done
    ) &
    watcher=$!
    stop() { trap - TERM INT; kill -TERM "$child" 2>/dev/null || true; kill "$watcher" 2>/dev/null || true; wait "$child" || true; exit 0; }
    trap stop TERM INT
    set +e
    wait "$child"
    status=$?
    kill "$watcher" 2>/dev/null || true
    wait "$watcher" 2>/dev/null || true
    exit "$status"
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr crit;
    events { worker_connections 512; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 8081;
        location = /ready { return 200 "ok"; }
        location / { return 404; }
      }
      server {
        listen 8080 ssl;
        ssl_certificate /etc/pinelink/tls/tls.crt;
        ssl_certificate_key /etc/pinelink/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
{{- if $previewAccess.enabled }}
        auth_basic "Pinelink private preview";
        auth_basic_user_file /etc/pinelink/auth/htpasswd;
{{- end }}
        client_max_body_size 16m;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "private, no-store" always;
        location /api/ {
          proxy_pass https://{{ .Release.Name }}-api:8080/;
          proxy_ssl_trusted_certificate /etc/pinelink/ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Pinelink-Client-IP $http_cf_connecting_ip;
          proxy_set_header Authorization "";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 650s;
          proxy_request_buffering off;
        }
        location /v1/ {
          proxy_pass https://{{ .Release.Name }}-api:8080;
          proxy_ssl_trusted_certificate /etc/pinelink/ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Pinelink-Client-IP $http_cf_connecting_ip;
          proxy_set_header Authorization "";
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 650s;
          proxy_request_buffering off;
        }
        location = /healthz {
          proxy_pass https://{{ .Release.Name }}-api:8080/healthz;
          proxy_ssl_trusted_certificate /etc/pinelink/ca/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_server_name on;
          proxy_ssl_name {{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local;
        }
        location = /sw.js { expires -1; }
        location = /service-config.json { alias /etc/pinelink/service-profile/service-config.json; default_type application/json; }
        location = /version.json { expires -1; }
        location ^~ /designs/ {
          try_files $uri =404;
          add_header Cross-Origin-Opener-Policy same-origin always;
          add_header Cross-Origin-Embedder-Policy require-corp always;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy no-referrer always;
          add_header Cache-Control "private, no-store, no-transform" always;
          add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
        }
        location = / {
          if ($arg_state != "") { rewrite ^ /api/v1/auth/google/callback last; }
          try_files /index.html =404;
        }
        location / { try_files $uri $uri/ /index.html; }
      }
    }
