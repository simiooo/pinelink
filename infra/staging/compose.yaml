name: pinelink-staging
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pinelink
      POSTGRES_DB: pinelink
      POSTGRES_PASSWORD: ${PINELINK_STAGING_DB_PASSWORD:?set staging DB password}
    ports: ["127.0.0.1:55435:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinelink -d pinelink"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:54225:4222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:4.04
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3-config.json"]
    ports: ["127.0.0.1:59005:9000"]
    volumes: ["objects:/data"]
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3-config.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    image: pinelink-staging-api:${PINELINK_VERSION:?set source version}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PINELINK_VERSION}
    # Linux host networking exposes real ICE candidates for WebRTC; middleware stays loopback-only.
    network_mode: host
    environment:
      PINELINK_HTTP_ADDR: 0.0.0.0:18680
      PINELINK_DATABASE_URL: postgres://pinelink:${PINELINK_STAGING_DB_PASSWORD}@127.0.0.1:55435/pinelink?sslmode=disable
      PINELINK_NATS_URL: nats://127.0.0.1:54225
      PINELINK_S3_ENDPOINT: 127.0.0.1:59005
      PINELINK_S3_ACCESS_KEY: pinelink-staging
      PINELINK_S3_SECRET_KEY: ${PINELINK_STAGING_S3_SECRET:?set staging S3 secret}
      PINELINK_S3_BUCKET: pinelink-staging
      PINELINK_DEVICE_AUTH_REQUIRED: "true"
      PINELINK_HISTORY_SIGNING_SEED: ${PINELINK_HISTORY_SIGNING_SEED:?set history signing seed}
      PINELINK_CORS_ORIGINS: ${PINELINK_STAGING_CORS_ORIGINS:-http://127.0.0.1:18681}
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18680/healthz"]
      start_period: 30s
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
  nats-data:
  objects:
configs:
  s3-config:
    content: |
      {"identities":[{"name":"pinelink-staging","credentials":[{"accessKey":"pinelink-staging","secretKey":"${PINELINK_STAGING_S3_SECRET}"}],"actions":["Admin","Read","Write"]}]}
