    <text x="1004" y="558" font-size="19" font-weight="700" fill="#7A4B2E">03 · 20° 呆毛</text>
    <text x="1004" y="592" font-size="15" fill="#8A7160">一撮右倾呆毛，角度固定，不增减。</text>
  </g>
