<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1056" viewBox="0 0 1440 1056" id="Relay consent and motion contract"><rect x="0" y="0" width="1440" height="1056" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start">pinelink</text><text x="48" y="135.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">Relay / consent is independent from upload</text><text x="48" y="170.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Product states and motion / additive proposal, not an implemented backend contract</text><text x="48" y="247.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#0866FF" text-anchor="start">01</text><text x="144" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Upload before consent</text><text x="144" y="274.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">This device → Cloud</text><text x="568" y="238.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Blue = durable uplink bytes. Sheen stays inside that prefix.</text><text x="568" y="274.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Sender may upload while the recipient decision is PENDING.</text><rect x="48" y="336" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="395.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#0866FF" text-anchor="start">02</text><text x="144" y="392.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Stored, awaiting recipient</text><text x="144" y="422.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Clock badge on Cloud</text><text x="568" y="386.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Seal acknowledged → sheen fades in 80ms; curve exits in 180ms.</text><text x="568" y="422.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Stored is not Delivered. Sender can go offline after durable seal.</text><rect x="48" y="484" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="543.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#0866FF" text-anchor="start">03</text><text x="144" y="540.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Accept and receive</text><text x="144" y="570.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Cloud → This device</text><text x="568" y="534.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Consent commits → lock exits in 120ms; downlink enters in 180ms.</text><text x="568" y="570.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">An accepted recipient may receive available chunks before full seal.</text><rect x="48" y="632" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="691.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#0866FF" text-anchor="start">04</text><text x="144" y="688.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Decline or expire</text><text x="144" y="718.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Access removed immediately</text><text x="568" y="682.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Sheen stops; curve exits in 120ms; history remains.</text><text x="568" y="718.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Release this share only. Physical deletion waits for zero valid references.</text><rect x="48" y="780" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="839.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#0866FF" text-anchor="start">05</text><text x="144" y="836.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Receive and verify</text><text x="144" y="866.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Receipt before completion</text><text x="568" y="830.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Full bytes → static verifying badge → receipt → quiet exit.</text><text x="568" y="866.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">No automatic 100% completion before integrity and local commit.</text><rect x="48" y="928" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="1002.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start">Reduced motion: immediate state changes; no sheen, travel or scale animation. No fake byte progress.</text></svg>