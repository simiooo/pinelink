<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1056" viewBox="0 0 1440 1056" id="Atomic references and garbage collection"><rect x="0" y="0" width="1440" height="1056" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start">pinelink</text><text x="48" y="135.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">Reference-safe deletion / one atomic authority</text><text x="48" y="170.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Database transaction revokes access; a fenced worker deletes immutable object generations.</text><text x="48" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">References</text><text x="440" y="238.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Delivery staging · private library · explicit persistent keep</text><text x="440" y="274.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Reference ledger is authoritative. A cached ref_count is never the sole proof.</text><rect x="48" y="312" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="364.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Terminal transaction</text><text x="440" y="358.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Transfer state + revoke grant + release reference + outbox</text><text x="440" y="394.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Idempotency key prevents double release. Delivery-owned FileEntry is released too.</text><rect x="48" y="432" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="484.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Serialize decisions</text><text x="440" y="478.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Lock object generation → transfer → references and leases</text><text x="440" y="514.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Attach, Keep, release and GC use the same parent lock and a global lock order.</text><rect x="48" y="552" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="604.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">GC eligibility</text><text x="440" y="598.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">No live references, retention holds or valid I/O leases</text><text x="440" y="634.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">CAS to DELETING with a generation and delete token. New attaches must fail.</text><rect x="48" y="672" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="724.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Physical deletion</text><text x="440" y="718.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Retry a sealed key manifest; finalize only the matching token</text><text x="440" y="754.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Immutable generation-specific keys isolate stale GC and late upload writers.</text><rect x="48" y="792" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="844.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Races and recovery</text><text x="440" y="838.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Reject vs seal · Keep vs GC · duplicate or delayed workers</text><text x="440" y="874.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">No resurrection. Orphan sweep handles a late successful object PUT.</text><rect x="48" y="912" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="1006.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start">Existing expiry clocks stay unchanged. Rejection removes this share, not another valid private or shared copy.</text></svg>