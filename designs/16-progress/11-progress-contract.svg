<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1072" viewBox="0 0 1440 1072" id="Progress contract"><rect x="0" y="0" width="1440" height="1072" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start" >pinelink</text><text x="48" y="127.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start" >Progress is data. Activity is motion.</text><rect x="48" y="160" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="214.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Visible hierarchy</text><text x="272" y="214.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Main: two nodes and one 3px curve. Blue = acknowledged bytes; gray = remaining bytes.</text><rect x="48" y="244" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="278.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Details on demand</text><text x="272" y="278.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Click curve / either node. Desktop modal / mobile bottom sheet. All numbers and controls live here.</text><rect x="48" y="308" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="342.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Known total</text><text x="272" y="342.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >floor(acknowledged_bytes / total_bytes × 100). Byte counts use one consistent basis.</text><rect x="48" y="372" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="406.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Unknown / empty</text><text x="272" y="406.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Unknown total has no percentage or ETA. Empty known file waits for verification; never divide by zero.</text><rect x="48" y="436" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="470.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Actual completion</text><text x="272" y="470.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >100% means bytes acknowledged. Receipt / verified completion unlocks Delivered or Received.</text><rect x="48" y="500" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="534.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Cloud completion</text><text x="272" y="534.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Sealed upload means Stored in cloud. It never implies recipient delivery.</text><rect x="48" y="564" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="598.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Time estimate</text><text x="272" y="598.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Use a 3–8s active sample window; show only after stable throughput. Hide on pause / stale data.</text><rect x="48" y="628" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="662.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Out of order</text><text x="272" y="662.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Snapshot has state_version + progress_revision + sampled_at. Reject stale progress and terminal regressions.</text><rect x="48" y="692" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="726.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Pause / reconnect</text><text x="272" y="726.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Freeze byte progress. Remove throughput / ETA. Resume keeps the same task and starts new samples.</text><rect x="48" y="756" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="790.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Multiple files</text><text x="272" y="790.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Sum acknowledged bytes / total bytes. Do not average per-file percentages. Retry is a new attempt.</text><rect x="48" y="820" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="854.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Motion</text><text x="272" y="854.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Blue extent follows bytes ≤180ms. Soft 1600ms light pass stays clipped inside the blue arc.</text><rect x="48" y="884" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="918.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Accessibility</text><text x="272" y="918.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Progressbar gets actual value. State / 10% milestones announced; no per-frame announcements.</text><rect x="48" y="948" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="1014.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >This page supersedes the activity-only transfer screens in v14 / v15.</text></svg>