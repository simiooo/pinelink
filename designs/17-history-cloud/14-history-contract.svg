<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="976" viewBox="0 0 1440 976" id="History and retention contract"><rect x="0" y="0" width="1440" height="976" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start" >pinelink</text><text x="48" y="127.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start" >History survives. Availability changes.</text><rect x="48" y="160" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="222.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Reusable</text><text x="264" y="222.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >An authorized cloud copy or verified local bookmark exists. Restore / Send again follows capabilities.</text><rect x="48" y="252" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="286.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >One-time</text><text x="264" y="286.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >This transfer has no retained reusable copy. Keep its record; Choose files starts a new transfer.</text><rect x="48" y="316" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="350.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Expired</text><text x="264" y="350.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >The retained copy passed expiry. Keep the record; Restore / Keep available is unavailable.</text><rect x="48" y="380" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="414.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Cloud source</text><text x="264" y="414.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >A logical source for this restore, not a peer device or presence claim. Show only for an authorized copy.</text><rect x="48" y="444" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="478.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Retention</text><text x="264" y="478.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Availability and retention policy are independent. A temporary copy can be reusable until expiry.</text><rect x="48" y="508" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="542.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Keep available</text><text x="264" y="542.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Explicit promotion before expiry, with ownership / quota / entitlement checks. No invented pricing.</text><rect x="48" y="572" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="606.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Restore</text><text x="264" y="606.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Create a fresh PullSession. Cloud → this device uses the accepted blue arc / bounded light motion.</text><rect x="48" y="636" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="670.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Verification</text><text x="264" y="670.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Restored requires local decrypt / integrity checks and commit. 100% alone is not success.</text><rect x="48" y="700" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="734.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >History visibility</text><text x="264" y="734.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >A past receipt is not permission to fetch again. Re-check grants, copy state and encrypted envelope.</text><rect x="48" y="764" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="798.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Destructive actions</text><text x="264" y="798.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Remove record and Delete cloud copy are separate operations with explicit wording.</text><rect x="48" y="828" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="918.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start" >Commercial entitlements decide capabilities; never turn a missing or expired copy into a purchasable restore.</text></svg>