<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1144" viewBox="0 0 1440 1144" id="State authority mapping"><rect x="0" y="0" width="1440" height="1144" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start" >pinelink</text><text x="48" y="124.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start" >State authority and transitions</text><rect x="48" y="152" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >Source</text><text x="432" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >UI</text><text x="736" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >Rule</text><text x="48" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >device ACTIVE</text><text x="432" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Authorization valid</text><text x="736" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Reachability still decides online / offline.</text><rect x="48" y="264" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="289.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >device REVOKED</text><text x="432" y="289.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Locked / blocked</text><text x="736" y="289.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Do not send. Apply the server cancellation.</text><rect x="48" y="308" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="333.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >transfer PENDING</text><text x="432" y="333.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Waiting / Receive request</text><text x="736" y="333.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Wait for the recipient action.</text><rect x="48" y="352" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="377.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >transfer ACCEPTED</text><text x="432" y="377.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Connecting</text><text x="736" y="377.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Acceptance is not a delivery receipt.</text><rect x="48" y="396" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="421.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >task QUEUED</text><text x="432" y="421.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Queued</text><text x="736" y="421.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Keep the path static.</text><rect x="48" y="440" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="465.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >task RUNNING</text><text x="432" y="465.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Sending / Receiving</text><text x="736" y="465.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >One activity segment. Reverse for receive.</text><rect x="48" y="484" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="509.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >task PAUSED</text><text x="432" y="509.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Paused</text><text x="736" y="509.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Only this state can resume the same task.</text><rect x="48" y="528" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="553.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >task / transfer FAILED</text><text x="432" y="553.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Try again</text><text x="736" y="553.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Start a new attempt. Do not resume FAILED.</text><rect x="48" y="572" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="597.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >REJECTED / CANCELLED</text><text x="432" y="597.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Terminal feedback</text><text x="736" y="597.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Respect the actor; do not auto resend.</text><rect x="48" y="616" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="641.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >transfer EXPIRED</text><text x="432" y="641.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Request expired</text><text x="736" y="641.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >New request only if the file is still valid.</text><rect x="48" y="660" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="685.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >file EXPIRED / DELETED</text><text x="432" y="685.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >File unavailable</text><text x="736" y="685.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Choose a valid file again.</text><rect x="48" y="704" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="729.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >UPLOAD COMPLETED</text><text x="432" y="729.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Stored in cloud</text><text x="736" y="729.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Stored does not mean received.</text><rect x="48" y="748" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Verified delivery receipt</text><text x="432" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Delivered / Received</text><text x="736" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Success marker belongs to the receiver.</text><rect x="48" y="792" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="817.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >task DELETED</text><text x="432" y="817.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Hidden from history</text><text x="736" y="817.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Remove after acknowledgement, then reflow.</text><rect x="48" y="836" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="861.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >UI dragging / hover</text><text x="432" y="861.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Drop allowed / blocked</text><text x="736" y="861.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Capture radius +24px. Exit hysteresis +8px.</text><rect x="48" y="880" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="905.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >UI staged / submitting</text><text x="432" y="905.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Ready to send</text><text x="736" y="905.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Drop stages files; Send creates the request.</text><rect x="48" y="924" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="949.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >UI verifying / HTTP 409</text><text x="432" y="949.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#101010" text-anchor="start" >Confirming / refreshed state</text><text x="736" y="949.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Latest version wins. Never invent success.</text><rect x="48" y="968" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="1041.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Source: devices.go / transfer.go / tasks.go / p2p.go / pull.go / SQL migrations 001, 003, 005.</text><text x="48" y="1086.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Server state, reachability and local interaction are separate dimensions. No new backend enums.</text></svg>