<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1056" viewBox="0 0 1440 1056" id="Motion contract"><rect x="0" y="0" width="1440" height="1056" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start" >pinelink</text><text x="48" y="124.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start" >Motion contract</text><rect x="48" y="152" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >Transition</text><text x="320" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >Duration</text><text x="448" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >From</text><text x="800" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >To</text><text x="1200" y="198.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#6E6E6E" text-anchor="start" >Reduced motion</text><text x="48" y="245.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Node enters</text><text x="320" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >200ms</text><text x="448" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / scale .96 / y +8</text><text x="800" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 1 / scale 1 / y 0</text><text x="1200" y="245.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="268" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="293.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Node leaves</text><text x="320" y="293.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >160ms</text><text x="448" y="293.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >current position</text><text x="800" y="293.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / scale .96 / y -4</text><text x="1200" y="293.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="316" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="341.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Select / unselect</text><text x="320" y="341.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >180ms</text><text x="448" y="341.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >64px / 100% context</text><text x="800" y="341.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >96px / 13% context</text><text x="1200" y="341.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >instant geometry</text><rect x="48" y="364" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="389.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Drag target enters</text><text x="320" y="389.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms</text><text x="448" y="389.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >64px / no halo</text><text x="800" y="389.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >72px / 112px halo / plus</text><text x="1200" y="389.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >instant halo</text><rect x="48" y="412" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="437.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Drag target leaves</text><text x="320" y="437.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >100ms</text><text x="448" y="437.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >active target</text><text x="800" y="437.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >normal node / no halo</text><text x="1200" y="437.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >instant reset</text><rect x="48" y="460" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="485.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Drop accepted</text><text x="320" y="485.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >140ms</text><text x="448" y="485.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >system drag image</text><text x="800" y="485.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >image ends / review opens</text><text x="1200" y="485.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >no chip motion</text><rect x="48" y="508" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="533.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Desktop panel enters</text><text x="320" y="533.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >180ms</text><text x="448" y="533.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / y +8 / scale .98</text><text x="800" y="533.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 1 / y 0 / scale 1</text><text x="1200" y="533.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="556" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="581.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Desktop panel leaves</text><text x="320" y="581.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms</text><text x="448" y="581.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >open panel</text><text x="800" y="581.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / y +4 / scale .985</text><text x="1200" y="581.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="604" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="629.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Mobile sheet enters</text><text x="320" y="629.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >240ms</text><text x="448" y="629.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / y +24</text><text x="800" y="629.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 1 / y 0</text><text x="1200" y="629.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="652" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="677.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Mobile sheet leaves</text><text x="320" y="677.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >180ms</text><text x="448" y="677.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >open sheet</text><text x="800" y="677.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >opacity 0 / y +24</text><text x="1200" y="677.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="700" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="725.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Transfer activity</text><text x="320" y="725.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >1800ms</text><text x="448" y="725.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >one 12% blue segment</text><text x="800" y="725.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >linear loop along same path</text><text x="1200" y="725.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >static segment</text><rect x="48" y="748" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="773.03" font-family="Segoe UI" font-size="13" font-weight="600" fill="#101010" text-anchor="start" >Delivery confirmed</text><text x="320" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >320ms</text><text x="448" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >activity segment</text><text x="800" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >140ms settle / 180ms curve exit</text><text x="1200" y="773.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >120ms fade</text><rect x="48" y="796" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="854.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Enter / change: cubic-bezier(.16, 1, .3, 1). Exit: cubic-bezier(.4, 0, 1, 1). Activity: linear.</text><text x="48" y="898.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >No bounce, orbiting controls, repeated glow or fake percentage. Hidden pages pause continuous motion.</text><text x="48" y="942.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >State updates interrupt the old transition. Stable node IDs preserve position and focus; stale versions cannot show success.</text><text x="48" y="986.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Success requires a delivery receipt or verified P2P completion. Upload completion only means stored, not delivered.</text></svg>