2.0 528.0) scale(1.3333333333333333)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="836.0" y="586.0" width="104" height="24" rx="0" fill="#FFFFFF" /><text x="888" y="602.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle" >MacBook Pro</text></g><circle cx="912" cy="568" r="11" fill="#0866FF" /><g id="plus" transform="translate(904 560) scale(0.6666666666666666)"><path d="M12 5v14 M5 12h14" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="888" y="668.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="middle" >Drop allowed</text><g id="Node-MacBook Pro" opacity="1"><circle cx="1224" cy="544" r="32.0" fill="#F5F5F5" /><g id="laptop" transform="translate(1208.0 528.0) scale(1.3333333333333333)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="1172.0" y="586.0" width="104" height="24" rx="0" fill="#FFFFFF" /><text x="1224" y="602.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle" >MacBook Pro</text></g><circle cx="1248" cy="568" r="14" fill="#FFFFFF" /><g id="ban" transform="translate(1238 558) scale(0.8333333333333334)"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M6 6l12 12" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1224" y="668.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="middle" >Drop blocked</text><rect x="48" y="728" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="788.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start" >Trust, reachability and interaction are independent</text><text x="48" y="838.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >ACTIVE / REVOKED is device authorization. ACTIVE does not prove the device is online.</text><text x="48" y="882.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Online / Offline / Connecting is derived from reachability. Cloud is a storage capability.</text><text x="48" y="926.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Hover / Focus / Selected / Drop allowed / Drop blocked is local UI state, never a server status.</text><text x="48" y="970.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Offline targets may offer explicit asynchronous storage; online-only drops stay blocked.</text><text x="48" y="1014.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >A drag gesture freezes node positions. The hit target extends 24px beyond the node radius.</text></svg>