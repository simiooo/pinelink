<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" id="Route continuity and independent completion"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start">pinelink</text><text x="48" y="135.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">Path continuity / storage does not decide delivery</text><text x="48" y="170.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Backend projection and motion contract / proposal only, not implemented</text><text x="48" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Separate facts</text><text x="392" y="238.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">delivery_progress · spool_progress · active_route</text><text x="392" y="274.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Recipient ACKs, durable cloud ACKs and transport telemetry have different authorities.</text><rect x="48" y="316" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="368.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Direct ↔ relay</text><text x="392" y="362.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Same transfer / attempt / receiver checkpoint</text><text x="392" y="398.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Deduplicate by content + chunk identity. Route epoch orders route telemetry, not byte totals.</text><rect x="48" y="440" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="492.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Do not reset</text><text x="392" y="486.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Keep the blue boundary and the peer identities</text><text x="392" y="522.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">During a real gap, fade sheen in 80ms. Resume in 120ms after fresh progress.</text><rect x="48" y="564" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="616.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Cloud phase → peer</text><text x="392" y="610.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Change display_metric_id and the destination identity</text><text x="392" y="646.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Exit old path in 120ms; replace node in 200ms; enter new leg in 180ms.</text><rect x="48" y="688" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="740.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Independent outcomes</text><text x="392" y="734.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Delivered may succeed while cloud sealing fails</text><text x="392" y="770.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Preserve the receipt. Mark only the cloud copy unavailable in details/history.</text><rect x="48" y="812" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="864.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">One receipt rule</text><text x="392" y="858.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">Direct / relay / cloud pull all verify and commit locally</text><text x="392" y="894.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">100% acknowledged bytes is not the delivery receipt. Failed verification never gets a check.</text><rect x="48" y="936" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="1030.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start">Reduced motion: immediate identity and state changes, no sheen or travel. Route switching never extends retention.</text></svg>