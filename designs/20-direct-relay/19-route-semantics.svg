<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="928" viewBox="0 0 1440 928" id="Routes and progress meaning"><rect x="0" y="0" width="1440" height="928" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start">pinelink</text><text x="48" y="135.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">Two routes / one delivery contract</text><text x="48" y="170.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Direct and live relay show peers. Cloud nodes represent an actual storage destination or source.</text><text x="48" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Direct</text><path d="M192.000 504.000 C48.000 464.000 48.000 400.000 192.000 336.000" fill="none" stroke="#EBEBEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M192.000 504.000 C91.322 476.034 61.033 436.336 101.134 393.109" fill="none" stroke="#0866FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M112.569 470.957 C107.382 467.439 102.901 463.831 99.127 460.142" fill="none" stroke="#80B1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g id="Identity / MacBook Pro" opacity="1"><circle cx="192" cy="304" r="32.0" fill="#F5F5F5" /><g id="laptop" transform="translate(176.0 288.0) scale(1.3333333333333333)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="140.0" y="342.0" width="104" height="24" rx="0" fill="#FFFFFF" /><text x="192" y="358.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle">MacBook Pro</text></g><g id="Identity / This device" opacity="1"><circle cx="192" cy="552" r="48.0" fill="#F5F5F5" /><g id="laptop" transform="translate(168.0 528.0) scale(2.0)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="146.0" y="606.0" width="92" height="24" rx="0" fill="#FFFFFF" /><text x="192" y="622.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="middle">This device</text></g><text x="48" y="684.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Delivery · 62%</text><text x="48" y="722.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">100% → verify → receipt</text><text x="48" y="758.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start">No server copy required.</text><rect x="360" y="224" width="1" height="556" rx="0" fill="#EBEBEB" /><text x="384" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Relay / live</text><path d="M528.000 504.000 C384.000 464.000 384.000 400.000 528.000 336.000" fill="none" stroke="#EBEBEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M528.000 504.000 C427.322 476.034 397.033 436.336 437.134 393.109" fill="none" stroke="#0866FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M448.569 470.957 C443.382 467.439 438.901 463.831 435.127 460.142" fill="none" stroke="#80B1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g id="Identity / MacBook Pro" opacity="1"><circle cx="528" cy="304" r="32.0" fill="#F5F5F5" /><g id="laptop" transform="translate(512.0 288.0) scale(1.3333333333333333)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="476.0" y="342.0" width="104" height="24" rx="0" fill="#FFFFFF" /><text x="528" y="358.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle">MacBook Pro</text></g><g id="Identity / This device" opacity="1"><circle cx="528" cy="552" r="48.0" fill="#F5F5F5" /><g id="laptop" transform="translate(504.0 528.0) scale(2.0)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="482.0" y="606.0" width="92" height="24" rx="0" fill="#FFFFFF" /><text x="528" y="622.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="middle">This device</text></g><text x="384" y="684.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Delivery · 62%</text><text x="384" y="722.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">100% → verify → receipt</text><text x="384" y="758.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start">Spool · 88% stays in details.</text><rect x="696" y="224" width="1" height="556" rx="0" fill="#EBEBEB" /><text x="720" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Cloud / upload</text><path d="M864.000 504.000 C720.000 464.000 720.000 400.000 864.000 336.000" fill="none" stroke="#EBEBEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M864.000 504.000 C763.322 476.034 733.033 436.336 773.134 393.109" fill="none" stroke="#0866FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M784.569 470.957 C779.382 467.439 774.901 463.831 771.127 460.142" fill="none" stroke="#80B1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g id="Identity / Cloud" opacity="1"><circle cx="864" cy="304" r="32.0" fill="#F5F5F5" /><g id="cloud" transform="translate(848.0 288.0) scale(1.3333333333333333)"><path d="M6 18h12a4 4 0 0 0 1-7.87A7 7 0 0 0 5.15 9 4.5 4.5 0 0 0 .85 9z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="836.0" y="342.0" width="56" height="24" rx="0" fill="#FFFFFF" /><text x="864" y="358.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle">Cloud</text></g><g id="Identity / This device" opacity="1"><circle cx="864" cy="552" r="48.0" fill="#F5F5F5" /><g id="laptop" transform="translate(840.0 528.0) scale(2.0)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="818.0" y="606.0" width="92" height="24" rx="0" fill="#FFFFFF" /><text x="864" y="622.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="middle">This device</text></g><text x="720" y="684.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Upload · 62%</text><text x="720" y="722.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">100% → seal → Stored</text><text x="720" y="758.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start">Stored is not Delivered.</text><rect x="1032" y="224" width="1" height="556" rx="0" fill="#EBEBEB" /><text x="1056" y="244.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Cloud / receive</text><path d="M1200.000 336.000 C1056.000 400.000 1056.000 464.000 1200.000 504.000" fill="none" stroke="#EBEBEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1200.000 336.000 C1103.871 378.724 1071.914 421.448 1104.130 457.033" fill="none" stroke="#0866FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1125.093 378.593 C1120.238 382.417 1115.918 386.222 1112.132 390.001" fill="none" stroke="#80B1FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g id="Identity / Cloud" opacity="1"><circle cx="1200" cy="304" r="32.0" fill="#F5F5F5" /><g id="cloud" transform="translate(1184.0 288.0) scale(1.3333333333333333)"><path d="M6 18h12a4 4 0 0 0 1-7.87A7 7 0 0 0 5.15 9 4.5 4.5 0 0 0 .85 9z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="1172.0" y="342.0" width="56" height="24" rx="0" fill="#FFFFFF" /><text x="1200" y="358.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="middle">Cloud</text></g><g id="Identity / This device" opacity="1"><circle cx="1200" cy="552" r="48.0" fill="#F5F5F5" /><g id="laptop" transform="translate(1176.0 528.0) scale(2.0)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="1154.0" y="606.0" width="92" height="24" rx="0" fill="#FFFFFF" /><text x="1200" y="622.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="middle">This device</text></g><text x="1056" y="684.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Delivery · 62%</text><text x="1056" y="722.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start">100% → verify → receipt</text><text x="1056" y="758.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start">Cloud is the actual source.</text><text x="48" y="838.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start">A route change never changes the delivery metric. A phase change may change the metric and must replace its identity.</text><text x="48" y="874.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Existing cloud preupload screens apply to the cloud phase only. Live relay does not automatically become a Cloud node.</text></svg>