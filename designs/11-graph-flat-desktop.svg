<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1500" viewBox="0 0 1920 1500">
  <defs>
    <filter id="flatShadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/></filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.08"/></filter>
    <g id="laptop" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-13" y="-10" width="26" height="18" rx="1"/><path d="M-18 12h36l-4-4h-28z"/></g>
    <g id="phone" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-8" y="-14" width="16" height="28" rx="2"/><path d="M-2 10h4"/></g>
    <g id="tablet" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-11" y="-15" width="22" height="30" rx="2"/><path d="M-2 11h4"/></g>
    <g id="nas" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-12" y="-14" width="24" height="28" rx="1"/><path d="M-12-3h24M-6 7h.1M1 7h5"/></g>
    <g id="send" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12V-10M-7-3l7-7 7 7M-11 12h22"/></g>
    <g id="folder" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-9h10l4 4h14v17h-28z"/></g>
    <g id="history" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-3a13 13 0 1 1-1 9M-14-10v8h8M0-7v8l6 3"/></g>
    <g id="more" fill="currentColor"><circle cx="-8" r="2"/><circle r="2"/><circle cx="8" r="2"/></g>
    <g id="cloud" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 7h23a8 8 0 0 0 1-15 11 11 0 0 0-21-2A8.5 8.5 0 0 0-12 7z"/></g>
    <g id="file" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-15-21H5l11 11v31h-31zM5-21v11h11M-8 2H9M-8 10H5"/></g>
    <g id="close" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M-6-6L6 6M6-6L-6 6"/></g>

    <!-- 64px peer nodes, 96px own/selected nodes; icons are about half the diameter. -->
    <g id="peerMac">
      <circle r="32" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><use href="#laptop" transform="scale(.9)" color="#262626"/>
      <circle cx="23" cy="23" r="7" fill="#FFFFFF"/><circle cx="23" cy="23" r="4.5" fill="#111111"/>
      <text y="56" text-anchor="middle" font-size="13" fill="#404040">MacBook</text>
    </g>
    <g id="peerPhone">
      <circle r="32" fill="#FFFFFF" stroke="#A3A3A3" stroke-width="1.5"/><use href="#phone" transform="scale(.9)" color="#404040"/>
      <circle cx="23" cy="23" r="7" fill="#FFFFFF"/><circle cx="23" cy="23" r="4.5" fill="#FFFFFF" stroke="#737373" stroke-width="1.5"/>
      <text y="56" text-anchor="middle" font-size="13" fill="#404040">手机</text>
    </g>
    <g id="peerNas">
      <circle r="32" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><use href="#nas" transform="scale(.9)" color="#262626"/>
      <circle cx="23" cy="23" r="10" fill="#111111" stroke="#FFFFFF" stroke-width="2"/><use href="#cloud" transform="translate(23 23) scale(.4)" color="#FFFFFF"/>
      <text y="56" text-anchor="middle" font-size="13" fill="#404040">小窝云仓</text>
    </g>
    <g id="peerTablet" opacity="0.42">
      <circle r="32" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1.5"/><use href="#tablet" transform="scale(.9)" color="#737373"/>
      <circle cx="23" cy="23" r="7" fill="#FFFFFF"/><circle cx="23" cy="23" r="4.5" fill="#A3A3A3"/>
      <text y="56" text-anchor="middle" font-size="13" fill="#737373">平板</text>
    </g>
    <g id="ownNode">
      <circle r="48" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1.5"/><use href="#laptop" transform="scale(1.2)" color="#111111"/>
      <circle cx="36" cy="35" r="9" fill="#FFFFFF"/><circle cx="36" cy="35" r="5.5" fill="#111111"/>
      <text y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">本机</text>
    </g>
    <g id="selectedMac">
      <circle r="48" fill="#FFFFFF" stroke="#111111" stroke-width="2" filter="url(#flatShadow)"/><use href="#laptop" transform="scale(1.2)" color="#111111"/>
      <circle cx="36" cy="35" r="9" fill="#FFFFFF"/><circle cx="36" cy="35" r="5.5" fill="#111111"/>
      <text y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">MacBook Pro</text>
    </g>
  </defs>

  <rect width="1920" height="1500" fill="#FFFFFF"/>
  <g font-family="Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
    <g transform="translate(64 40)">
      <circle cx="22" cy="22" r="22" fill="#111111"/><path d="M14 25c6-15 17-15 19-5 1 7-7 12-13 7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      <text x="60" y="24" font-size="24" font-weight="650" fill="#111111">Pinelink</text><text x="60" y="46" font-size="13" fill="#737373">平面节点图 · PC</text>
    </g>
    <text x="1856" y="68" text-anchor="end" font-size="13" fill="#737373">64px 普通节点 / 96px 本机节点</text>
    <path d="M64 104H1856" stroke="#E5E5E5"/>

    <g transform="translate(48 136)">
      <text x="32" y="28" font-size="14" font-weight="600" fill="#111111">01　默认</text><text x="856" y="28" text-anchor="end" font-size="12" fill="#8A8A8A">节点比例 1 : 1.5</text>
      <g fill="none" stroke="#E0E0E0" stroke-width="1.5">
        <path d="M444 410C400 330 238 320 170 242"/><path d="M444 410C420 310 352 278 340 184"/>
        <path d="M444 410C468 310 536 278 548 184"/><path d="M444 410C488 330 650 320 718 242"/>
      </g>
      <use href="#peerMac" transform="translate(170 210)"/><use href="#peerPhone" transform="translate(340 152)"/>
      <use href="#peerNas" transform="translate(548 152)"/><use href="#peerTablet" transform="translate(718 210)"/>
      <use href="#ownNode" transform="translate(444 458)"/>
    </g>

    <g transform="translate(984 136)">
      <text x="32" y="28" font-size="14" font-weight="600" fill="#111111">02　选中</text><text x="856" y="28" text-anchor="end" font-size="12" fill="#8A8A8A">48px 操作按钮</text>
      <g opacity="0.13">
        <path d="M444 410C390 324 240 315 170 242M444 410C498 324 648 315 718 242" fill="none" stroke="#A3A3A3" stroke-width="1.5"/>
        <use href="#peerPhone" transform="translate(170 210)"/><use href="#peerNas" transform="translate(718 210)"/><use href="#ownNode" transform="translate(444 458)"/>
      </g>
      <circle cx="444" cy="224" r="112" fill="none" stroke="#E5E5E5" stroke-dasharray="3 7"/>
      <use href="#selectedMac" transform="translate(444 224)"/>
      <g transform="translate(332 224)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#send" color="#262626"/></g>
      <g transform="translate(376 116)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#folder" color="#262626"/></g>
      <g transform="translate(512 116)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#history" color="#262626"/></g>
      <g transform="translate(556 224)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#more" color="#262626"/></g>
    </g>

    <path d="M64 744H1856M960 128V1408" stroke="#E5E5E5"/>

    <g transform="translate(48 780)">
      <text x="32" y="28" font-size="14" font-weight="600" fill="#111111">03　发送中</text><text x="856" y="28" text-anchor="end" font-size="12" fill="#8A8A8A">单条贝塞尔曲线</text>
      <path d="M350 464C350 350 560 356 560 216" fill="none" stroke="#E5E5E5" stroke-width="3" stroke-linecap="round"/>
      <path d="M350 464C350 350 560 356 560 216" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" pathLength="200" stroke-dasharray="24 176" stroke-dashoffset="-20"><animate attributeName="stroke-dashoffset" from="-20" to="-220" dur="1.8s" repeatCount="indefinite"/></path>
      <use href="#peerMac" transform="translate(560 184)"/><use href="#ownNode" transform="translate(350 512)"/>
    </g>

    <g transform="translate(984 780)">
      <text x="32" y="28" font-size="14" font-weight="600" fill="#111111">04　传输记录</text><text x="856" y="28" text-anchor="end" font-size="12" fill="#8A8A8A">图标与文件名</text>
      <g opacity="0.22"><path d="M128 432V224" stroke="#A3A3A3" stroke-width="1.5"/><use href="#peerMac" transform="translate(128 192)"/><use href="#ownNode" transform="translate(128 480)"/></g>
      <g transform="translate(60 260)"><circle r="24" fill="#111111"/><use href="#history" color="#FFFFFF"/></g>
      <rect x="248" y="80" width="600" height="492" fill="#FFFFFF" stroke="#E5E5E5" filter="url(#panelShadow)"/>
      <text x="280" y="128" font-size="22" font-weight="600" fill="#111111">传输记录</text>
      <g transform="translate(812 120)"><circle r="24" fill="#FFFFFF"/><use href="#close" color="#525252"/></g><path d="M280 152H816" stroke="#EEEEEE"/>
      <g transform="translate(348 230)"><use href="#file" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">设计源文件.fig</text></g>
      <g transform="translate(548 230)"><use href="#folder" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">现场照片</text></g>
      <g transform="translate(748 230)"><use href="#file" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">产品演示.mp4</text></g>
      <g transform="translate(348 414)"><use href="#file" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">字体包.zip</text></g>
      <g transform="translate(548 414)"><use href="#folder" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">项目资料</text></g>
      <g transform="translate(748 414)"><use href="#file" transform="scale(1.35)" color="#262626"/><text y="54" text-anchor="middle" font-size="13" fill="#404040">合同.pdf</text></g>
    </g>
    <text x="64" y="1456" font-size="12" fill="#8A8A8A">普通节点 64px · 本机与选中节点 96px · 设备图标约为节点直径的 50%</text>
    <text x="1856" y="1456" text-anchor="end" font-size="12" fill="#8A8A8A">PC 概念稿</text>
  </g>
</svg>
