<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="832" viewBox="0 0 1440 832" id="Semantic spacing and status rules"><rect x="0" y="0" width="1440" height="832" rx="0" fill="#FFFFFF" /><g id="Pinelink mark" transform="translate(48 40) scale(1.5)"><path d="M5 15c0-5 3-9 7-9s7 3 7 7-3 7-7 7c-2 0-4-1-4-3s2-4 4-4h3" fill="none" stroke="#101010" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="69.92" font-family="Segoe UI" font-size="32" font-weight="600" fill="#101010" text-anchor="start">pinelink</text><text x="48" y="127.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">Semantic spacing / status economy</text><text x="48" y="215.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">4</text><text x="232" y="212.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Metadata within one identity</text><text x="232" y="242.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Filename and supporting count; metric and rate.</text><rect x="48" y="260" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="295.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">8</text><text x="232" y="292.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Object and name</text><text x="232" y="322.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Disc to device name. File icon to filename. Title to required reason.</text><rect x="48" y="340" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="375.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">12</text><text x="232" y="372.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Inline identity</text><text x="232" y="402.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Icon and adjacent text in a horizontal file row.</text><rect x="48" y="420" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="455.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">24</text><text x="232" y="452.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Distinct content groups</text><text x="232" y="482.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Heading to file. File identity to metrics. History heading / tabs: 16px.</text><rect x="48" y="500" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="535.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">32</text><text x="232" y="532.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Action or collection boundary</text><text x="232" y="562.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Tabs to grid. File rows. Content to confirmation actions.</text><rect x="48" y="580" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="615.44" font-family="Segoe UI" font-size="24" font-weight="600" fill="#101010" text-anchor="start">16 / 12</text><text x="232" y="612.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start">Status badge / glyph</text><text x="232" y="642.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">One quiet overlay. Hover and focus reveal meaning; tap opens details.</text><rect x="48" y="660" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="734.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="start">History title = device name. Files = icon + name. Dense file groups share a local left axis.</text><text x="48" y="778.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start">Critical errors keep a short visible reason. Badges reveal routine state on hover / focus / touch.</text></svg>