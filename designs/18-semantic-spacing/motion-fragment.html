      <button class="pl-node cursor-interaction" type="button" data-node="2" aria-label="Cloud vault，可保存到云端"><span class="pl-halo"></span><span class="pl-disc"><i data-lucide="server" aria-hidden="true"></i></span><span class="pl-cloud"><i data-lucide="cloud" aria-hidden="true"></i></span><span class="pl-cue"><i data-lucide="plus" aria-hidden="true"></i></span><span class="pl-name">Cloud vault</span><span class="pl-drop-label"></span></button>

      <div class="pl-orbit" hidden>

        <button type="button" class="pl-round pl-folder cursor-interaction" aria-label="打开文件夹" data-tooltip="Open folder" data-folder><i data-lucide="folder" aria-hidden="true"></i></button>
        <button type="button" class="pl-round pl-orbit-more cursor-interaction" aria-label="设备更多操作" data-tooltip="More" data-orbit-more><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      </div>
      <div class="pl-hint" hidden></div>
      <div class="pl-ghost" hidden><i data-lucide="mouse-pointer-2" aria-hidden="true"></i><span><i data-lucide="file" aria-hidden="true"></i>Design source.fig</span></div>
    </div>
    <section class="pl-history" aria-label="Transfer history" hidden>
      <div class="pl-history-head"><h2>MacBook Pro</h2><button class="pl-icon cursor-interaction" type="button" aria-label="Close transfer history" data-history-close><i data-lucide="x" aria-hidden="true"></i></button></div>

      <div class="pl-history-grid"></div>
    </section>
    <div class="pl-shade" hidden></div>
    <section class="pl-sheet" role="dialog" aria-modal="true" aria-labelledby="pl-dialog-title" hidden>
      <div class="pl-handle" aria-hidden="true"></div><div class="pl-sheet-head"><div class="pl-sheet-icon" aria-hidden="true"><i data-lucide="arrow-up-from-line"></i></div><div class="pl-sheet-heading">
      <button class="pl-icon pl-record-more cursor-interaction" type="button" aria-label="Keep file available" data-tooltip="Keep available" data-record-more hidden><i data-lucide="ellipsis" aria-hidden="true"></i></button>
      <h2 id="pl-dialog-title">Ready to send</h2><p class="pl-sheet-note">To MacBook Pro</p></div></div>
      <div class="pl-file-row"><i data-lucide="file" aria-hidden="true"></i><span><strong data-filename>Design source.fig</strong><small data-filecount>and 2 more files</small></span></div>
      <p class="pl-policy-note" data-policy-note hidden></p>
      <section class="pl-progress" aria-label="Transfer progress" hidden>
        <div class="pl-progress-identity"><i data-lucide="file-video" aria-hidden="true"></i><p class="pl-progress-file" data-progress-file>Product demo.mp4</p></div>
        <div class="pl-progress-head" role="progressbar" aria-label="Acknowledged file bytes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62"><strong data-percent>62%</strong><span class="pl-progress-meta" data-progress-bytes>320 MB of 512 MB</span></div>
        <p class="pl-progress-meta" data-progress-rate>12.8 MB/s · About 15 sec left</p>
      </section>
      <div class="pl-actions"><button class="cursor-interaction" type="button" data-secondary>Cancel</button><button class="pl-primary cursor-interaction" type="button" data-primary>Send</button></div>
    </section>
  </div>
  <p class="text-small" data-status role="status" aria-live="polite">演示数据；数字由确认字节样本驱动，曲线只表示活动。</p>
</div>
<style>

 app.addEventListener('drop',e=>{if(!dragging)return;e.preventDefault();const target=nearest(e.clientX,e.clientY),id=target?.dataset.node;const names=Array.from(e.dataTransfer.files||[],f=>f.name),demo=Array.from(e.dataTransfer.types||[]).includes('application/x-pinelink-demo');endDrag();if(!names.length&&!demo){openSheet('unavailable');say('无法读取拖入的文件，请重新选择；没有创建虚假文件。');return;}files=names.length?names:[...fixture];if(id==='0'||id==='2'){openSheet(id==='2'?'async':'prepared');say('文件已放下并暂存，确认后才发送。');}else{showHint('Choose another device');say('该位置不可放置，文件未发送。');}});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!sheet.hidden){const retain=sheetKind.startsWith('record-')||['progress','task','pending','paused','reconnect','cancel'].includes(sheetKind);closeSheet().then(ok=>{if(ok&&!retain)idle();});}else if(app.dataset.view==='history'){hideHistory();}else if(app.dataset.pose==='transfer'){say('传输继续。点击曲线或节点可查看详情并取消。');}else{reset();say('已取消当前界面操作，未发送文件。');}}if(e.key==='Tab'&&!sheet.hidden){const buttons=Array.from(sheet.querySelectorAll('button')).filter(b=>!b.hidden&&!b.disabled&&b.getClientRects().length),a=buttons[0],b=buttons.at(-1);if(a===b){e.preventDefault();a.focus();}else if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}});
 window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent;if(incoming?.scenario&&Array.from(scenario.options).some(o=>o.value===incoming.scenario)&&incoming.scenario!==chosen){chosen=incoming.scenario;scenario.value=chosen;reduce.checked=!!incoming.reduced||media.matches;reset();}});
 document.addEventListener('visibilitychange',()=>app.classList.toggle('pl-reduced',document.hidden||reduced()));
 function trimHistoryTooltips(){$$('.pl-file').forEach(b=>{const n=b.querySelector('.pl-file-name'),r=records[Number(b.dataset.record)];b.dataset.tooltip=(n.scrollWidth>n.clientWidth?n.textContent+' · ':'')+statusLabel(r);});}
 new MutationObserver(()=>requestAnimationFrame(trimHistoryTooltips)).observe($('.pl-history-grid'),{childList:true});new ResizeObserver(trimHistoryTooltips).observe($('.pl-history-grid'));
 new ResizeObserver(()=>{draw();}).observe(graph);app.classList.toggle('pl-reduced',reduced());icons();fixtureProgress();if(chosen==='history')openHistory();else phase('running');requestAnimationFrame(draw);
 setInterval(()=>{if(!document.hidden&&app.dataset.phase==='running')renderProgress();},1000);
 root.pinelinkPreview={play,reset,openSheet,phase,draw,sample,fixtureProgress,complete,openHistory,openRecord,startCloudRestore,getState:()=>({phase:app.dataset.phase,pose:app.dataset.pose,view:app.dataset.view,sheet:sheet.hidden?null:sheetKind,reduced:reduced(),dragging,target:activeTarget?.dataset.node||null,files:files.length,bytes:progress.bytes,total:progress.total,revision:progress.revision,selectedRecord,records:records.map(r=>({name:r.name,state:r.state,source:r.source,retention:r.retention}))})};
})();
</script>
