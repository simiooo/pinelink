<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="flatShadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/></filter>
    <g id="laptop" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-13" y="-10" width="26" height="18" rx="1"/><path d="M-18 12h36l-4-4h-28z"/></g>
    <g id="phone" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-8" y="-14" width="16" height="28" rx="2"/><path d="M-2 10h4"/></g>
    <g id="tablet" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-11" y="-15" width="22" height="30" rx="2"/><path d="M-2 11h4"/></g>
    <g id="nas" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="-12" y="-14" width="24" height="28" rx="1"/><path d="M-12-3h24M-6 7h.1M1 7h5"/></g>
    <g id="send" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 12V-10M-7-3l7-7 7 7M-11 12h22"/></g>
    <g id="folder" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-9h10l4 4h14v17h-28z"/></g>
    <g id="history" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-3a13 13 0 1 1-1 9M-14-10v8h8M0-7v8l6 3"/></g>
    <g id="more" fill="currentColor"><circle cx="-8" r="2"/><circle r="2"/><circle cx="8" r="2"/></g>
    <g id="cloud" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 7h23a8 8 0 0 0 1-15 11 11 0 0 0-21-2A8.5 8.5 0 0 0-12 7z"/></g>
    <g id="file" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-15-21H5l11 11v31h-31zM5-21v11h11M-8 2H9M-8 10H5"/></g>
    <g id="back" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6-10L-4 0l10 10M-4 0h16"/></g>

    <!-- 56px peer nodes, 80px own/selected nodes; icons are about half the diameter. -->
    <g id="peerMac">
      <circle r="28" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><use href="#laptop" transform="scale(.8)" color="#262626"/>
      <circle cx="20" cy="20" r="7" fill="#FFFFFF"/><circle cx="20" cy="20" r="4.5" fill="#111111"/>
      <text y="48" text-anchor="middle" font-size="12" fill="#404040">MacBook</text>
    </g>
    <g id="peerPhone">
      <circle r="28" fill="#FFFFFF" stroke="#A3A3A3" stroke-width="1.5"/><use href="#phone" transform="scale(.8)" color="#404040"/>
      <circle cx="20" cy="20" r="7" fill="#FFFFFF"/><circle cx="20" cy="20" r="4.5" fill="#FFFFFF" stroke="#737373" stroke-width="1.5"/>
      <text y="48" text-anchor="middle" font-size="12" fill="#404040">手机</text>
    </g>
    <g id="peerNas">
      <circle r="28" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/><use href="#nas" transform="scale(.8)" color="#262626"/>
      <circle cx="20" cy="20" r="9" fill="#111111" stroke="#FFFFFF" stroke-width="2"/><use href="#cloud" transform="translate(20 20) scale(.36)" color="#FFFFFF"/>
      <text y="48" text-anchor="middle" font-size="12" fill="#404040">小窝云仓</text>
    </g>
    <g id="peerTablet" opacity="0.42">
      <circle r="28" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1.5"/><use href="#tablet" transform="scale(.8)" color="#737373"/>
      <circle cx="20" cy="20" r="7" fill="#FFFFFF"/><circle cx="20" cy="20" r="4.5" fill="#A3A3A3"/>
      <text y="48" text-anchor="middle" font-size="12" fill="#737373">平板</text>
    </g>
    <g id="ownNode">
      <circle r="40" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1.5"/><use href="#phone" color="#111111"/>
      <circle cx="30" cy="29" r="8" fill="#FFFFFF"/><circle cx="30" cy="29" r="5" fill="#111111"/>
      <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">本机</text>
    </g>
    <g id="selectedMac">
      <circle r="40" fill="#FFFFFF" stroke="#111111" stroke-width="2" filter="url(#flatShadow)"/><use href="#laptop" color="#111111"/>
      <circle cx="30" cy="29" r="8" fill="#FFFFFF"/><circle cx="30" cy="29" r="5" fill="#111111"/>
      <text y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#111111">MacBook Pro</text>
    </g>
  </defs>

  <rect width="1840" height="1120" fill="#F7F7F7"/>
  <g font-family="Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
    <text x="40" y="58" font-size="24" font-weight="650" fill="#111111">Pinelink · 移动端</text>
    <text x="1800" y="56" text-anchor="end" font-size="13" fill="#737373">56px 普通节点 / 80px 本机节点</text>
    <text x="40" y="116" font-size="14" font-weight="600" fill="#404040">01　默认</text><text x="480" y="116" font-size="14" font-weight="600" fill="#404040">02　选中</text>
    <text x="920" y="116" font-size="14" font-weight="600" fill="#404040">03　发送中</text><text x="1360" y="116" font-size="14" font-weight="600" fill="#404040">04　传输记录</text>

    <g transform="translate(40 140)">
      <rect width="390" height="844" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="20" y="52" font-size="20" font-weight="650" fill="#111111">Pinelink</text><g transform="translate(346 40)"><circle r="24" fill="#FFFFFF"/><use href="#more" color="#262626"/></g>
      <g fill="none" stroke="#E0E0E0" stroke-width="1.5">
        <path d="M195 610C160 500 106 374 103 248M195 610C230 500 284 374 287 248"/>
        <path d="M195 610C160 548 112 494 103 416M195 610C230 548 278 494 287 416"/>
      </g>
      <use href="#peerMac" transform="translate(103 220)"/><use href="#peerPhone" transform="translate(287 220)"/>
      <use href="#peerNas" transform="translate(103 388)"/><use href="#peerTablet" transform="translate(287 388)"/>
      <use href="#ownNode" transform="translate(195 650)"/>
    </g>

    <g transform="translate(480 140)">
      <rect width="390" height="844" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="20" y="52" font-size="20" font-weight="650" fill="#111111">Pinelink</text><g transform="translate(346 40)"><circle r="24" fill="#FFFFFF"/><use href="#more" color="#262626"/></g>
      <g opacity="0.12">
        <use href="#peerPhone" transform="translate(103 220)"/><use href="#peerNas" transform="translate(287 220)"/>
        <path d="M195 610V296" stroke="#A3A3A3" stroke-width="1.5"/><use href="#ownNode" transform="translate(195 650)"/>
      </g>
      <circle cx="195" cy="356" r="112" fill="none" stroke="#E5E5E5" stroke-dasharray="3 7"/>
      <use href="#selectedMac" transform="translate(195 356)"/>
      <g transform="translate(83 356)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#send" color="#262626"/></g>
      <g transform="translate(125 256)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#folder" color="#262626"/></g>
      <g transform="translate(265 256)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#history" color="#262626"/></g>
      <g transform="translate(307 356)"><circle r="24" fill="#FFFFFF" stroke="#D4D4D4"/><use href="#more" color="#262626"/></g>
    </g>

    <g transform="translate(920 140)">
      <rect width="390" height="844" fill="#FFFFFF" stroke="#E5E5E5"/>
      <text x="20" y="52" font-size="20" font-weight="650" fill="#111111">Pinelink</text><g transform="translate(346 40)"><circle r="24" fill="#FFFFFF"/><use href="#more" color="#262626"/></g>
      <path d="M195 626C112 526 280 408 195 278" fill="none" stroke="#E5E5E5" stroke-width="3" stroke-linecap="round"/>
      <path d="M195 626C112 526 280 408 195 278" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" pathLength="200" stroke-dasharray="24 176" stroke-dashoffset="-20"><animate attributeName="stroke-dashoffset" from="-20" to="-220" dur="1.8s" repeatCount="indefinite"/></path>
      <use href="#peerMac" transform="translate(195 250)"/><use href="#ownNode" transform="translate(195 666)"/>
    </g>

    <g transform="translate(1360 140)">
      <rect width="390" height="844" fill="#FFFFFF" stroke="#E5E5E5"/>
      <g transform="translate(36 44)"><circle r="24" fill="#FFFFFF"/><use href="#back" color="#262626"/></g><g transform="translate(346 44)"><circle r="24" fill="#FFFFFF"/><use href="#more" color="#262626"/></g>
      <text x="20" y="124" font-size="24" font-weight="600" fill="#111111">传输记录</text><path d="M20 152H370" stroke="#EEEEEE"/>
      <g transform="translate(75 234)"><use href="#file" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">设计源文件.fig</text></g>
      <g transform="translate(195 234)"><use href="#folder" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">现场照片</text></g>
      <g transform="translate(315 234)"><use href="#file" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">产品演示.mp4</text></g>
      <g transform="translate(75 414)"><use href="#file" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">字体包.zip</text></g>
      <g transform="translate(195 414)"><use href="#folder" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">项目资料</text></g>
      <g transform="translate(315 414)"><use href="#file" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">合同.pdf</text></g>
      <g transform="translate(75 594)"><use href="#file" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">演示文稿.key</text></g>
      <g transform="translate(195 594)"><use href="#folder" transform="scale(1.4)" color="#262626"/><text y="58" text-anchor="middle" font-size="12" fill="#404040">离线备份</text></g>
    </g>
    <text x="40" y="1040" font-size="12" fill="#737373">普通节点 56px · 本机与选中节点 80px · 本机使用手机图标</text>
    <text x="1800" y="1040" text-anchor="end" font-size="12" fill="#737373">移动端概念稿</text>
  </g>
</svg>
