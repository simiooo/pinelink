-weight="400" fill="#6E6E6E" text-anchor="middle" >Primary</text><g id="Component-Action-Focus" ><g id="Action-send" ><rect x="480" y="528" width="48" height="48" rx="0" fill="#FFFFFF" opacity="0"/><circle cx="504" cy="552" r="28" fill="none" stroke="#0866FF" stroke-width="2" /><circle cx="504" cy="552" r="24" fill="#0866FF" /><g id="send" transform="translate(492 540) scale(1.0)"><path d="M12 20V4 M6 10l6-6 6 6 M5 20h14" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></g></g></g><text x="504" y="609.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="middle" >Focus</text><g id="Component-Button-Secondary" ><g id="Button-Decline" ><rect x="48" y="652" width="88" height="48" rx="24" fill="#F5F5F5" /><text x="92.0" y="680.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#101010" text-anchor="middle" >Decline</text></g></g><g id="Component-Button-Primary" ><g id="Button-Accept" ><rect x="176" y="652" width="84" height="48" rx="24" fill="#0866FF" /><text x="218.0" y="680.65" font-family="Segoe UI" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Accept</text></g></g><text x="48" y="745.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >48px targets / 24px icons / 2px focus ring / 4px offset</text><g id="Action-more" ><rect x="768" y="528" width="48" height="48" rx="0" fill="#FFFFFF" opacity="0"/><circle cx="792" cy="552" r="24" fill="#F5F5F5" /><g id="more" transform="translate(780 540) scale(1.0)"><path d="M5 12h.01 M12 12h.01 M19 12h.01" fill="none" stroke="#101010" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="848" y="512" width="256" height="136" rx="24" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="1" /><g id="history" transform="translate(868 532) scale(0.8333333333333334)"><path d="M3 5v5h5 M3.5 10a9 9 0 1 1 .5 7 M12 7v5l3 2" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="904" y="546.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start" >Transfer history</text><g id="chevron" transform="translate(1060 532) scale(0.8333333333333334)"><path d="M9 5l7 7-7 7" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="868" y="572" width="216" height="1" rx="0" fill="#EBEBEB" /><g id="laptop" transform="translate(868 596) scale(0.8333333333333334)"><path d="M4 4h16v12H4z M2 20h20l-2-4H4z" fill="none" stroke="#101010" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="904" y="610.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#101010" text-anchor="start" >Device details</text><text x="768" y="694.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >Select a node → More → Transfer history</text><text x="768" y="745.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Icon actions have tooltips, accessible names and visible focus.</text><rect x="48" y="780" width="1344" height="1" rx="0" fill="#EBEBEB" /><text x="48" y="832.2" font-family="Segoe UI" font-size="20" font-weight="600" fill="#101010" text-anchor="start" >Activity and recovery</text><text x="48" y="884.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="start" >Transferring</text><text x="48" y="921.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >3px gray track + one 4px blue segment.</text><text x="392" y="884.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="start" >1.8s loop</text><text x="392" y="921.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Linear motion. About 12% of the path.</text><text x="736" y="884.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="start" >Reduced motion</text><text x="736" y="921.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Static segment. No looping activity.</text><text x="1080" y="884.96" font-family="Segoe UI" font-size="16" font-weight="600" fill="#101010" text-anchor="start" >Paused / Disconnected</text><text x="1080" y="921.03" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6E6E6E" text-anchor="start" >Static track + a short recovery sheet.</text><text x="48" y="994.65" font-family="Segoe UI" font-size="15" font-weight="400" fill="#6E6E6E" text-anchor="start" >The loop shows activity. It never implies a real completion percentage.</text></svg>