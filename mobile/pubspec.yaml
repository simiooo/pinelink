name: pinelink_mobile
description: Pinelink Flutter client
publish_to: "none"
version: 0.1.0+13

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  http: ^1.3.0
  file_picker: 13.3.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0
  sodium: 4.1.2+1
  dartage: ^0.3.0
  flutter_webrtc: 1.6.3
  bonsoir: 7.1.6
  mobile_scanner: 7.5.0
  qr_flutter: 4.1.0
  flutter_markdown_plus: 1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/google-continue-neutral.png
    - assets/licenses/
  licenses:
    - assets/licenses/libsodium-ISC.txt
    - assets/fonts/OFL.txt
    - assets/fonts/noto-sans-sc/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/noto-sans-sc/NotoSansSC-Variable.ttf
