name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python3 infra/scripts/test_flutter_offline_shell.py
      - run: |
          mkdir -p "$RUNNER_TEMP/pinelink-helm"
          curl -fsSL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/pinelink-helm/helm.tar.gz"
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/pinelink-helm/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pinelink-helm/helm.tar.gz" -C "$RUNNER_TEMP/pinelink-helm"
          "$RUNNER_TEMP/pinelink-helm/linux-amd64/helm" lint infra/helm/pinelink
          "$RUNNER_TEMP/pinelink-helm/linux-amd64/helm" template pinelink infra/helm/pinelink --namespace pinelink-staging >/dev/null
          python3 infra/scripts/check-preview-access.py --helm "$RUNNER_TEMP/pinelink-helm/linux-amd64/helm" --chart infra/helm/pinelink --output "$RUNNER_TEMP/pinelink-preview-access.json"
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [protocol, backend, cli]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - run: go test -race -p 2 ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        relay_transport: [webrtc, websocket]
    env:
      PINELINK_RELAY_TRANSPORT: ${{ matrix.relay_transport }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: '**/go.sum'
      - run: |
          if [[ "$PINELINK_RELAY_TRANSPORT" == websocket ]]; then
            export PINELINK_TEST_FILTER='^(TestP2PDirectRelayAndFallback|TestRelayPreuploadConsentAndRestore|TestP2PRelaySocketPauseAndResume)$'
          fi
          bash infra/scripts/integration.sh
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run audit:production
      - run: npm test
      - run: npm run build
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: '**/go.sum'
      - id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: python3 infra/scripts/prepare-flutter-web.py
      - run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
        working-directory: mobile
      - run: python3 infra/scripts/flutter-offline-shell.py mobile/build/web
      - run: flutter build apk --debug --target-platform=android-arm64
        working-directory: mobile
